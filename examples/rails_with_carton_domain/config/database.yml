default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch('MAIN_DATABASE') { Rails.root.join('storage/development.sqlite3') }.to_s.inspect %>

test:
  <<: *default
  database: <%= ENV.fetch('MAIN_DATABASE') { Rails.root.join('storage/test.sqlite3') }.to_s.inspect %>
