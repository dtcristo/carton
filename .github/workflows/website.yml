name: Website

# Builds the site on every change to it, and deploys to Cloudflare Workers
# only from main. The deploy job's `production` environment holds the
# Cloudflare secrets; restrict it to the main branch in the repository
# settings so pull requests can never reach them.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - CONTEXT.md
      - .mise.toml
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - CONTEXT.md
      - .mise.toml
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node (pinned in .mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: node
      - run: npm ci
      - name: Build, checking every internal link
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://carton.dtcristo.com
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node (pinned in .mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: node
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: website/dist
      - name: Deploy the built site
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
